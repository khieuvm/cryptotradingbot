# ═══════════════════════════════════════════════════════════════════════════════
# Crypto Engine — Base Configuration
# Single source of truth for all strategy parameters and system settings
# Environment-specific overrides go in config/env/{backtest,dryrun,live}.yaml
# ═══════════════════════════════════════════════════════════════════════════════

version: 2

# ── Exchange ──────────────────────────────────────────────────────────────────
exchange:
  name: okx
  trading_mode: futures
  margin_mode: isolated

# ── Network (corporate proxy — set empty string when not on F-Soft network) ──
# proxy: "http://khieuvm:Lamsaoday2601@fsoft-proxy:8080"
proxy: ""

# ── Market ────────────────────────────────────────────────────────────────────
market:
  timeframe: 15m
  pairs:
    - ETH/USDT:USDT

# ── Cost Model ────────────────────────────────────────────────────────────────
costs:
  maker_fee: 0.0002
  taker_fee: 0.0005
  funding_avg: 0.0001

# ── Leverage ──────────────────────────────────────────────────────────────────
leverage:
  default: 3
  max_allowed: 5
  liquidation_buffer: 0.15

# ── Risk Management ──────────────────────────────────────────────────────────
risk:
  max_open_trades: 6
  max_portfolio_heat: 0.15
  max_correlation_exposure: 0.6
  circuit_breaker:
    max_daily_drawdown: 0.08
    max_weekly_drawdown: 0.12
    consecutive_losses_halt: 5
    cooldown_hours: 4

# ── Signal Tracker (auto-disable) ────────────────────────────────────────────
signal_tracker:
  window: 20
  disable_threshold_wr: 0.40
  disable_lookback: 10
  disable_duration_hours: 24
  severe_threshold_wr: 0.35
  severe_lookback: 20

# ── Regime Detection ─────────────────────────────────────────────────────────
regime:
  adx_trending: 25
  adx_ranging: 20
  atr_volatile_mult: 2.0
  funding_extreme_positive: 0.0008
  funding_extreme_negative: -0.0007

# ── Sessions (UTC) ───────────────────────────────────────────────────────────
sessions:
  asia: ["00:00", "08:00"]
  europe: ["08:00", "13:00"]
  us: ["13:00", "21:00"]
  dead: ["21:00", "00:00"]

# ── Funding Rate ─────────────────────────────────────────────────────────────
funding:
  settlement_times_utc: ["00:00", "08:00", "16:00"]
  extreme_positive: 0.001
  extreme_negative: -0.001

# ── Validation Requirements ──────────────────────────────────────────────────
validation:
  min_trades: 50
  min_days: 90
  walk_forward_is: 60
  walk_forward_oos: 30
  walk_forward_step: 30
  mc_permutations: 100
  mc_p_threshold: 0.05
  max_drawdown_a: 0.10
  max_drawdown_b: 0.15

# ── Trade Defaults ───────────────────────────────────────────────────────────
stake_amount: 50
max_stake_amount: 100

# ── Entry Filters ────────────────────────────────────────────────────────────
entry_filters:
  atr_spike_max: 0.04
  min_volume_ratio: 0.4
  btc_rsi_long_min: 35
  btc_rsi_short_max: 65
  btc_ret3_threshold: 0.005
  funding_long_max: 0.0005
  funding_short_min: -0.0005
  wave_filter_enabled: true

# ══════════════════════════════════════════════════════════════════════════════
# ACTIVE STRATEGIES
# ══════════════════════════════════════════════════════════════════════════════

active_strategies:
  - regime_adaptive
  - ha_stoch_rev

# ── Per-Strategy Configuration ───────────────────────────────────────────────
strategies:
  regime_adaptive:
    grade: A
    pairs: [BTC/USDT:USDT, ETH/USDT:USDT, SOL/USDT:USDT]
    timeframe: 15m
    startup_candle_count: 220
    entry:
      adx_trend_thr: 31
      rsi_os: 25
      rsi_ob: 70
      vol_min: 1.5
      ema_fast: 18
      ema_slow: 50
      atr_spike_thr: 2.2
      entry_atr_fraction: 0.15
      cross_lookback: 5
    exit:
      sl_atr_mult: 7.0
      tp_atr_mult: 11.0
      time_cut_2h: -0.015
      time_cut_8h: -0.01
      time_cut_12h: -0.005
      time_cut_24h: 0.0
      time_cut_48h: 0.005
    stake:
      default: 1.0
    protections:
      cooldown_candles: 5
      stoploss_guard_trades: 3
      stoploss_guard_lookback: 96
      stoploss_guard_pause: 40
      max_drawdown: 0.15
      max_drawdown_lookback: 96
      max_drawdown_pause: 120
    pair_overrides:
      ETH/USDT:USDT:
        entry:
          method: market
        exit:
          sl_atr_mult: 7.0
          time_cut_8h: -0.01
        stake: 1.0
      SOL/USDT:USDT:
        entry:
          method: market
        exit:
          sl_atr_mult: 7.0
          time_cut_12h: -0.005
        stake: 1.5


  cb_adx_breakout:
    grade: B
    pairs: [BTC/USDT:USDT, ETH/USDT:USDT, SOL/USDT:USDT]
    timeframe: 15m
    startup_candle_count: 60
    entry:
      compression_thr: 0.9
      vol_min: 0.6
      adx_max: 30
      adx_lookback: 3
      rsi_max: 72
      rsi_min: 22
      dedup_bars: 6
    exit:
      sl_atr_mult: 3.0
      tp_atr_mult: 5.0
      time_cut_2h: -0.01
      time_cut_6h: -0.005
      time_cut_12h: 0.002
    stake:
      default: 1.0
    pair_overrides:
      SOL/USDT:USDT:
        entry:
          method: limit_atr
          atr_offset: 0.1
          fill_window: 4
        exit:
          sl_atr_mult: 3.5
        stake: 1.5
      ETH/USDT:USDT:
        entry:
          method: market
        exit:
          sl_atr_mult: 3.0
        stake: 1.0


  volume_spike_rev:
    grade: B
    pairs: [BTC/USDT:USDT, ETH/USDT:USDT, SOL/USDT:USDT]
    timeframe: 15m
    startup_candle_count: 60
    entry:
      spike_mult: 3.0
      body_ratio_min: 0.55
      rsi_short_max: 50
      rsi_short_min: 15
      rsi_os_thr: 25
      shadow_body_ratio: 2.0
      vol_min: 1.0
      vol_ema_len: 20
    exit:
      sl_atr_mult: 3.0
      tp_atr_mult: 5.0
      time_cut_4h: -0.005
      time_cut_8h: -0.003
      time_cut_12h: 0.0
    stake:
      default: 1.0
    pair_overrides:
      ETH/USDT:USDT:
        entry:
          method: market
        exit:
          sl_atr_mult: 4.0
          tp_atr_mult: 5.0
        stake: 1.0
      SOL/USDT:USDT:
        entry:
          method: market
        exit:
          sl_atr_mult: 3.0
          tp_atr_mult: 6.0
        stake: 1.0

  ha_stoch_rev:
    grade: A   # ETH+SOL SHORT: WF OOS PF=1.41, WR=60%, MC p=0.018. SOL hyperopt PF=2.16 (stoch_ob=75, vol=1.2).
    pairs: [ETH/USDT:USDT, SOL/USDT:USDT]
    timeframe: 15m
    startup_candle_count: 120
    entry:
      ha_run_min: 2
      stoch_k: 14
      stoch_d: 3
      stoch_smooth: 7
      stoch_ob: 70
      stoch_os: 30
      ema_trend: 100
      vol_min: 1.0
      allow_longs: false
      dedup_bars: 6
    exit:
      sl_atr_mult: 2.5
      tp_atr_mult: 3.5
      time_cut_4h: -0.005
      time_cut_8h: -0.003
      time_cut_16h: 0.0
    stake:
      default: 1.0
    pair_overrides:
      ETH/USDT:USDT:
        exit:
          sl_atr_mult: 2.5
          tp_atr_mult: 3.5
        stake: 1.0
      SOL/USDT:USDT:
        entry:
          stoch_ob: 75
          vol_min: 1.2
        exit:
          sl_atr_mult: 1.5
          tp_atr_mult: 2.5
          time_cut_4h: -0.005
        stake: 1.0


  stoch_trend_pullback:
    grade: B   # OOS PF=1.48(SOL) MC p=0.00. ETH borderline. Low trade count (37 OOS).
    pairs: [ETH/USDT:USDT, SOL/USDT:USDT]
    timeframe: 15m
    startup_candle_count: 60
    entry:
      stoch_k: 14
      stoch_d: 3
      stoch_smooth: 7
      stoch_ob: 75
      stoch_os: 25
      adx_min: 18
      allow_longs: false
      dedup_bars: 4
    exit:
      sl_atr_mult: 1.5
      tp_atr_mult: 3.0
      time_cut_4h: -0.005
      time_cut_8h: 0.0
    stake:
      default: 1.0
    pair_overrides:
      ETH/USDT:USDT:
        exit:
          sl_atr_mult: 1.5
          tp_atr_mult: 5.0
      SOL/USDT:USDT:
        exit:
          sl_atr_mult: 1.5
          tp_atr_mult: 2.5


  ew_ob:
    grade: C   # WF 4/4 OOS pass, MC p=0.000. 5m freqtrade: PF=1.12, WR=64.1%, DD=5.02%. Standalone OOS PF=1.63.
    pairs: [ETH/USDT:USDT]
    timeframe: 5m
    startup_candle_count: 60
    entry:
      ob_touch_pct: 0.003
      dedup_bars: 12
      wave_filter_exempt: true
    exit:
      sl_atr_mult: 10.0
      price_sl_atr: 4.0
      price_tp_atr: 2.0
      fixed_sl_only: true
    stake:
      default: 1.0

